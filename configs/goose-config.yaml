OPENAI_HOST: http://127.0.0.1:8080
OPENAI_BASE_PATH: v1/chat/completions
GOOSE_MODE: approve
extensions:
  developer:
    enabled: true
    type: builtin
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    timeout: null
    bundled: true
  comfyui:
    enabled: true
    type: stdio
    name: comfyui
    cmd: C:\Users\gilbe\.local\bin\comfy-mcp.exe
    args: []
    envs:
      COMFY_BIN: C:\Users\gilbe\AppData\Roaming\uv\tools\comfy-mcp\Scripts\comfy.exe
      COMFY_HOST: 127.0.0.1
      COMFY_PORT: '8188'
      COMFY_T2I_TEMPLATE: image_z_image_turbo_int8
      COMFY_T2I_PROMPT_SLOT: 57.text
      COMFY_T2I_CHECKPOINT_SLOT: 57.unet_name
    timeout: 600
    description: Genera imagenes con Z-Image en local. Usa SIEMPRE generate_image(prompt) con el texto del usuario; no uses run_template, que ejecuta prompts de ejemplo.
  framepack:
    enabled: true
    type: stdio
    name: framepack
    cmd: C:\Users\gilbe\AppData\Local\Microsoft\WinGet\Packages\astral-sh.uv_Microsoft.Winget.Source_8wekyb3d8bbwe\uv.exe
    args:
      - run
      - --with
      - mcp
      - --with
      - gradio_client
      - --python
      - '3.12'
      - C:\AI\framepack-mcp.py
    envs:
      FRAMEPACK_URL: http://127.0.0.1:7860
    timeout: 3600
    description: Genera VIDEO a partir de una imagen con FramePack. MUY LENTO, unos 10,5 minutos por cada segundo de video. Llama antes a framepack_status y avisa al usuario del tiempo que va a tardar.
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: General computer control tools that don't require you to be a developer or engineer.
    display_name: Computer Controller
    timeout: 300
    bundled: true
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    description: Data visualization and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
  memory:
    enabled: false
    type: builtin
    name: memory
    description: Teach goose your preferences as you go.
    display_name: Memory
    timeout: 300
    bundled: true
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    description: Access interactive tutorials and guides
    display_name: Tutorial
    timeout: 300
    bundled: true
providers:
  openai:
    enabled: true
    model: qwen3.6
    configured: true
active_provider: openai
GOOSE_TELEMETRY_ENABLED: false
